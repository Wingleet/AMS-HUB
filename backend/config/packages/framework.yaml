# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: "%env(APP_SECRET)%"

    # Behind a reverse proxy Symfony ignores X-Forwarded-* unless the proxy is
    # trusted, so it reads the scheme as http and generates http:// redirects —
    # the EasyAdmin login and the SSO callbacks among them. Unset (dev, test,
    # anything run directly) this resolves to null and nothing is trusted.
    trusted_proxies: "%env(default::TRUSTED_PROXIES)%"
    trusted_headers:
        ["x-forwarded-for", "x-forwarded-host", "x-forwarded-proto", "x-forwarded-port"]

    # Note that the session will be started ONLY if you read or write from it.
    session:
        handler_id: null
        cookie_lifetime: 2592000 # 30 days
        cookie_secure: auto # Use secure cookies in production
        cookie_httponly: true # HttpOnly flag for security
        cookie_samesite: lax # Allow cross-site form submissions

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
